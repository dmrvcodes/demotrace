[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demotrace-shared"
version = "0.1.0"
description = "Models and limits shared by the DemoTrace Control API, Worker and CLI"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["demotrace_shared*"]
