[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demotrace"
version = "0.1.0"
description = "DemoTrace analysis pipeline: frames, speech, model call and validation"
requires-python = ">=3.12"
dependencies = [
  "demotrace-shared",
  "faster-whisper>=1.1",
  "ImageHash>=4.3",
  "numpy>=1.26",
  "Pillow>=10",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["demotrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs ffmpeg, macOS `say` and the whisper model (run with -m integration)"]
addopts = "-m 'not integration'"
