[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demotrace-control"
version = "0.1.0"
description = "Local and Lambda-ready Control API for DemoTrace"
requires-python = ">=3.12"
dependencies = [
  "demotrace-shared",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["demotrace_control*"]
